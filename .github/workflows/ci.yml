name: CI — Test & Deploy

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  VERCEL_ORG_ID:     ${{ secrets.VERCEL_ORG_ID }}
  VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
  NODE_VERSION: '22'

# ─────────────────────────────────────────────────────────────────────────────
# Flujo:
#
#   PR:   build → e2e (next start local) → deploy preview
#           Los E2E corren ANTES del deploy; son el gate de calidad.
#
#   main: build → deploy producción  (sin e2e — ya pasaron en el PR)
#           El merge a main solo recompila y despliega directo.
# ─────────────────────────────────────────────────────────────────────────────

jobs:
  # ─────────────────────────────────────────────────────────────
  # JOB 1: Build + typecheck
  # ─────────────────────────────────────────────────────────────
  build:
    name: Build & Typecheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: TypeScript check
        run: npx tsc --noEmit

      - name: Build
        run: npm run build
        env:
          NEXT_PUBLIC_SUPABASE_URL:      ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
          NEXT_PUBLIC_VAPID_PUBLIC_KEY:  ${{ secrets.NEXT_PUBLIC_VAPID_PUBLIC_KEY }}
          SUPABASE_SERVICE_ROLE_KEY:     ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          FOOTBALL_DATA_API_KEY:         ${{ secrets.FOOTBALL_DATA_API_KEY }}
          VAPID_PRIVATE_KEY:             ${{ secrets.VAPID_PRIVATE_KEY }}
          CRON_SECRET:                   ${{ secrets.CRON_SECRET }}

      # Solo en PRs: compartir el build con el job E2E (evita recompilar)
      - name: Upload build artifact
        if: github.event_name == 'pull_request'
        uses: actions/upload-artifact@v4
        with:
          name: next-build-${{ github.run_id }}
          path: .next/
          retention-days: 1
          # .next/ starts with "." — upload-artifact@v4 excludes hidden dirs by default
          include-hidden-files: true

  # ─────────────────────────────────────────────────────────────
  # JOB 2: E2E — solo en PRs (gate de calidad antes del deploy)
  # Levanta `next start` con el build del job anterior.
  # Sin BASE_URL → playwright.config usa webServer (next start en CI).
  # ─────────────────────────────────────────────────────────────
  e2e:
    name: E2E Tests (Playwright)
    runs-on: ubuntu-latest
    needs: build
    if: github.event_name == 'pull_request'
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Download build artifact
        uses: actions/download-artifact@v4
        with:
          name: next-build-${{ github.run_id }}
          path: .next/

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - name: Run E2E tests (smoke + auth)
        # Un solo comando = un solo servidor next start para todos los tests.
        # Separar en dos comandos causa que el segundo no pueda arrancar el servidor
        # porque next start limpia .next/server/ al cerrarse.
        run: npx playwright test e2e/smoke.spec.ts e2e/auth.spec.ts
        env:
          # Sin BASE_URL → playwright.config levanta `next start` en localhost:3000
          NEXT_PUBLIC_SUPABASE_URL:      ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
          NEXT_PUBLIC_VAPID_PUBLIC_KEY:  ${{ secrets.NEXT_PUBLIC_VAPID_PUBLIC_KEY }}
          SUPABASE_SERVICE_ROLE_KEY:     ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          FOOTBALL_DATA_API_KEY:         ${{ secrets.FOOTBALL_DATA_API_KEY }}
          VAPID_PRIVATE_KEY:             ${{ secrets.VAPID_PRIVATE_KEY }}
          CRON_SECRET:                   ${{ secrets.CRON_SECRET }}
          E2E_TEST_EMAIL:                ${{ secrets.E2E_TEST_EMAIL }}
          E2E_TEST_PASSWORD:             ${{ secrets.E2E_TEST_PASSWORD }}
          CI: true

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report-${{ github.run_id }}
          path: playwright-report/
          retention-days: 14

  # ─────────────────────────────────────────────────────────────
  # JOB 3a: Deploy preview en PRs — solo si E2E pasa
  # ─────────────────────────────────────────────────────────────
  deploy-preview:
    name: Deploy Preview
    runs-on: ubuntu-latest
    needs: e2e
    if: github.event_name == 'pull_request'
    permissions:
      pull-requests: write

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Install Vercel CLI
        run: npm install --global vercel@latest

      - name: Pull Vercel environment
        run: vercel pull --yes --environment=preview --token=${{ secrets.VERCEL_TOKEN }}

      - name: Build project artifacts
        run: vercel build --token=${{ secrets.VERCEL_TOKEN }}
        env:
          NEXT_PUBLIC_SUPABASE_URL:      ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
          NEXT_PUBLIC_VAPID_PUBLIC_KEY:  ${{ secrets.NEXT_PUBLIC_VAPID_PUBLIC_KEY }}
          SUPABASE_SERVICE_ROLE_KEY:     ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          FOOTBALL_DATA_API_KEY:         ${{ secrets.FOOTBALL_DATA_API_KEY }}
          VAPID_PRIVATE_KEY:             ${{ secrets.VAPID_PRIVATE_KEY }}
          CRON_SECRET:                   ${{ secrets.CRON_SECRET }}

      - name: Deploy to Vercel (preview)
        id: deploy
        run: |
          URL=$(vercel deploy --prebuilt --token=${{ secrets.VERCEL_TOKEN }})
          echo "url=$URL" >> $GITHUB_OUTPUT

      - name: Comment preview URL on PR
        uses: actions/github-script@v7
        with:
          script: |
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: `### ✅ E2E passed · Preview deployment ready\n\n**URL:** ${{ steps.deploy.outputs.url }}\n\n> Todos los tests E2E pasaron antes de este deploy.`
            })

  # ─────────────────────────────────────────────────────────────
  # JOB 3b: Deploy producción en main — directo tras el build
  # (los E2E ya pasaron en el PR; no se repiten en main)
  # ─────────────────────────────────────────────────────────────
  deploy-production:
    name: Deploy Production
    runs-on: ubuntu-latest
    needs: build
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Install Vercel CLI
        run: npm install --global vercel@latest

      - name: Pull Vercel environment
        run: vercel pull --yes --environment=production --token=${{ secrets.VERCEL_TOKEN }}

      - name: Build project artifacts
        run: vercel build --prod --token=${{ secrets.VERCEL_TOKEN }}
        env:
          NEXT_PUBLIC_SUPABASE_URL:      ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
          NEXT_PUBLIC_VAPID_PUBLIC_KEY:  ${{ secrets.NEXT_PUBLIC_VAPID_PUBLIC_KEY }}
          SUPABASE_SERVICE_ROLE_KEY:     ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          FOOTBALL_DATA_API_KEY:         ${{ secrets.FOOTBALL_DATA_API_KEY }}
          VAPID_PRIVATE_KEY:             ${{ secrets.VAPID_PRIVATE_KEY }}
          CRON_SECRET:                   ${{ secrets.CRON_SECRET }}

      - name: Deploy to Vercel (production)
        run: vercel deploy --prebuilt --prod --token=${{ secrets.VERCEL_TOKEN }}
